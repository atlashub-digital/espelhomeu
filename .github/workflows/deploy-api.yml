name: Deploy API (VPS)

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/shared/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}-api

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_VPS: ${{ secrets.VPS_HOST != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_VPS == 'true'

      - name: Sem secrets da VPS, salta o deploy
        if: env.HAS_VPS != 'true'
        run: echo "VPS_HOST não configurado; imagem publicada mas não implantada."

      - name: Sincronizar configuração da VPS
        if: env.HAS_VPS == 'true'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 22022
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infra/vps/docker-compose.yml,infra/vps/Caddyfile"
          target: "/opt/espelhomeu"
          strip_components: 2
          overwrite: true

      - name: Migrar e atualizar contentores na VPS
        if: env.HAS_VPS == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 22022
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/espelhomeu

            export APP_VERSION=${{ github.sha }}
            IMAGE="ghcr.io/${{ github.repository }}-api:${{ github.sha }}"

            docker compose up -d db
            docker pull "$IMAGE"

            ORDERS_TABLE="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select to_regclass('"'"'public.orders'"'"');"' | tr -d '[:space:]')"
            if [ "$ORDERS_TABLE" != "orders" ]; then
              echo "Applying commerce migration 0002_quick_checkout.sql"
              docker run --rm --entrypoint cat "$IMAGE" /app/drizzle/0002_quick_checkout.sql \
                | docker compose exec -T db sh -lc 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            else
              echo "Commerce migration already present; skipping."
            fi

            docker compose pull api
            docker compose up -d api
            docker compose ps
            docker image prune -f
            docker logout ghcr.io
