# Stack da VPS: Caddy (HTTPS automático) -> API (Fastify) -> Postgres.
# Uso na VPS (em /opt/espelhomeu, com .env ao lado):
#   docker compose pull && docker compose up -d
# Em desenvolvimento, só a base de dados:
#   docker compose -f infra/vps/docker-compose.yml up -d db
name: espelhomeu

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    image: ${API_IMAGE:-ghcr.io/atlashub-digital/espelhomeu-api:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_ORIGINS: ${WEB_ORIGINS:?defina WEB_ORIGINS}
      DATABASE_URL: postgres://${POSTGRES_USER:-espelhomeu}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-espelhomeu}
      APP_VERSION: ${APP_VERSION:-latest}
      WEB_BASE_URL: ${WEB_BASE_URL:-https://espelho.lia.doctor}
      COMMERCE_ENABLED: ${COMMERCE_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_API_VERSION: ${STRIPE_API_VERSION:-2025-06-30.basil}
      STRIPE_PAYMENT_METHODS: ${STRIPE_PAYMENT_METHODS:-automatic}
      ACCESS_TOKEN_DAYS: ${ACCESS_TOKEN_DAYS:-180}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-https://api.espelhomeu.lia.doctor}
      BR_PIX_PROVIDER: ${BR_PIX_PROVIDER:-pixgo}
      PIXGO_API_KEY: ${PIXGO_API_KEY:-}
      PIXGO_WEBHOOK_SECRET: ${PIXGO_WEBHOOK_SECRET:-}
      MISTICPAY_CLIENT_ID: ${MISTICPAY_CLIENT_ID:-}
      MISTICPAY_CLIENT_SECRET: ${MISTICPAY_CLIENT_SECRET:-}
    expose:
      - "4000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-espelhomeu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-espelhomeu}
      POSTGRES_DB: ${POSTGRES_DB:-espelhomeu}
    # Só exposto em localhost: nunca abrir o Postgres à internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  caddy_data:
  caddy_config:
